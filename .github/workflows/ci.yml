name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cpp-build:
    name: Build C++ Core Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake
      - name: Compile VectorDB
        working-directory: core-engine
        run: |
          g++ -O3 -std=c++17 -pthread main.cpp -o vectordb
          ./vectordb --version || true

  backend-test:
    name: Test FastAPI Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Test Vector Engine & DB
        run: |
          cd backend
          python -c "from app.engine.vector_engine import vector_engine; print(vector_engine.benchmark())"

  frontend-build:
    name: Build Next.js 15 Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
