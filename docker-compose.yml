version: "3.8"

services:
  # C++ High Performance Vector Core
  core-engine:
    build:
      context: ./core-engine
      dockerfile: Dockerfile
    container_name: vectordb-core
    ports:
      - "8080:8080"
    restart: unless-stopped

  # FastAPI Advanced RAG & API Gateway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vectordb-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CPP_CORE_URL=http://core-engine:8080
      - OLLAMA_HOST=http://host.docker.internal:11434
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - backend-data:/app/data
    depends_on:
      - core-engine
    restart: unless-stopped

  # Next.js 15 Interactive 2026 UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vectordb-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
